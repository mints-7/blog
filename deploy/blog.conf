# 拾光笔记 —— Hugo 静态站 + Nginx
# 部署：scp 到 /etc/nginx/sites-available/blog.conf，软链到 sites-enabled
# 证书：/etc/letsencrypt/live/mints.vip/（certbot certonly --webroot 签发）
#
# 说明：这台机器在广州，mints.vip 未备案，阿里云会对「Host/SNI 里带未备案域名」的
# 80/443 请求直接返回 403 / 重置连接。所以这里拆成两组 server：
#   1) 默认 server（裸 IP 访问）照常出内容，作为域名不通时的兜底入口
#   2) 域名 server 走正式逻辑，等备案通过或接入 Cloudflare 后自然生效

# ---------- 80：裸 IP / 未知 Host，直接出站点（兜底）----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/blog;
    index index.html;

    charset utf-8;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/blog;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# ---------- 80：域名，只做 ACME 校验 + 跳 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name mints.vip www.mints.vip;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/blog;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://mints.vip$request_uri;
    }
}

# ---------- 443：裸 IP（证书不含 IP，浏览器会提示，兜底用）----------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/mints.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mints.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/blog;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# ---------- 443：正式站点 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name mints.vip www.mints.vip;

    ssl_certificate     /etc/letsencrypt/live/mints.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mints.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/blog;
    index index.html;

    charset utf-8;
    server_tokens off;
    etag on;
    if_modified_since exact;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /index.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|avif|ico|woff2?)$ {
        # 只发一个 Cache-Control，避免 expires 与 add_header 各写一份
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ACME 校验目录要给 Let's Encrypt 开个口子，否则会被下面的 deny 规则挡成 403
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/blog;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
