# Pages CMS 配置：https://app.pagescms.org
# 这个文件决定后台里能编辑什么、字段怎么存。

media:
  input: blog/static/images
  output: /images

content:
  - name: posts
    label: 文章
    type: collection
    path: blog/content/posts
    exclude: ["_index.md"]
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
        options:
          maxlength: 120
      - name: date
        label: 发布时间
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssxxx"
      - name: summary
        label: 摘要（列表页显示）
        type: text
      - name: tags
        label: 标签
        type: string
        list: true
      - name: categories
        label: 分类
        type: string
        list: true
      - name: draft
        label: 草稿（勾选则暂不发布）
        type: boolean
        default: true
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true

  - name: pages
    label: 单页
    type: group
    items:
      - name: about
        label: 关于
        type: file
        path: blog/content/about.md
        fields:
          - name: title
            label: 标题
            type: string
          - name: description
            label: 页面描述
            type: text
          - name: body
            label: 正文
            type: rich-text
            options:
              format: markdown
