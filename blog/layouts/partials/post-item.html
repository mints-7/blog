<article class="post-item">
  <div class="post-item-head">
    <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    <span class="dot" aria-hidden="true">·</span>
    <span class="read-time">{{ .ReadingTime }} 分钟</span>
  </div>
  <h2 class="post-item-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  {{ with .Summary }}<p class="post-item-summary">{{ . | plainify | truncate 150 "" }}</p>{{ end }}
  {{ with .Params.tags }}
    <div class="post-item-tags">
      {{ range . }}<a class="tag" href="{{ printf "tags/%s/" (urlize .) | relURL }}">{{ . }}</a>{{ end }}
    </div>
  {{ end }}
</article>
