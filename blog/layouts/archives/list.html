{{ define "main" }}
<div class="wrap">
  <header class="list-header">
    <h1>归档</h1>
    <p class="list-count">共 {{ len (where site.RegularPages "Section" "posts") }} 篇</p>
  </header>
  {{ range (where site.RegularPages "Section" "posts").GroupByDate "2006" }}
    <section class="archive-year">
      <h2 class="archive-year-title">{{ .Key }}</h2>
      <ul class="archive-list">
        {{ range .Pages }}
          <li>
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01-02" }}</time>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          </li>
        {{ end }}
      </ul>
    </section>
  {{ end }}
</div>
{{ end }}
