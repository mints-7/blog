# 域名 mints.vip 未备案，阿里云会拦截 80/443 上的域名请求，所以暂时用裸 IP 做站点地址。
# 备案通过后改回：baseURL = "https://mints.vip/"
baseURL = "http://8.163.135.192/"
title = "拾光笔记"
theme = "hugo-PaperMod"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true
summaryLength = 80
timeZone = "Asia/Shanghai"
capitalizeListTitles = false
# 允许"日期比现在稍晚"的文章直接发布：手机/服务器时钟有偏差时不会神秘消失。
buildFuture = true

[pagination]
  pagerSize = 8

[params]
  author = "mints"
  description = "写代码，也写字。一个关于技术、阅读与日常的个人博客。"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true
  hidemeta = false
  hideSummary = false
  mainSections = ["posts"]
  env = "production"

  [params.homeInfoParams]
    Title = "拾光笔记"
    Content = "写代码，也写字。一个关于技术、阅读与日常的个人博客。"

  [params.assets]
    favicon = "favicon.svg"
    disableHLJS = false

  [params.editPost]
    URL = "https://github.com/mints-7/blog/edit/main/blog/content"
    Text = "在 GitHub 上编辑"
    appendFilePath = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/mints-7/blog"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[markup]
  [markup.highlight]
    style = "github"
    noClasses = false
    lineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    autoHeadingIDType = "github"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  category = "categories"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    pageRef = "/posts"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    pageRef = "/tags"
    weight = 20
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    pageRef = "/archives"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    pageRef = "/search"
    weight = 40
  [[menu.main]]
    identifier = "about"
    name = "关于"
    pageRef = "/about"
    weight = 50
